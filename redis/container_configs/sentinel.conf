port 26379
# Имя мастера, его IP (имя контейнера), порт и кворум (сколько сентинелов должны согласиться)
sentinel monitor mymaster redis-master 6379 2
# Через сколько мс мастер считается "мертвым" (5 секунд для быстрых тестов)
sentinel down-after-milliseconds mymaster 10000
# Сколько времени ждать перед следующим фейловером
sentinel failover-timeout mymaster 60000
# Сколько реплик могут синхронизироваться с новым мастером одновременно
sentinel parallel-syncs mymaster 1

# КРИТИЧЕСКИ ВАЖНО для Docker:
# Заставляем Sentinel использовать имена хостов, а не внутренние IP Docker-сети
sentinel resolve-hostnames yes
sentinel announce-hostnames yes