version: '3.8'

services:
  # 1. Главный узел (Master)
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./container_configs/redis-master-data:/data
    networks:
      - redis-net

  # 2. Первая реплика (Replica 1)
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379
    volumes:
      - ./container_configs/redis-replica-1-data:/data
    networks:
      - redis-net
    depends_on:
      - redis-master

  # 3. Вторая реплика (Replica 2)
  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    ports:
      - "6381:6379"
    command: redis-server --replicaof redis-master 6379
    volumes:
      - ./container_configs/redis-replica-2-data:/data
    networks:
      - redis-net
    depends_on:
      - redis-master

  # 4. Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./container_configs/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net
    depends_on:
      - redis-master

  # 5. Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./container_configs/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net
    depends_on:
      - redis-master

  # 6. Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./container_configs/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net
    depends_on:
      - redis-master

networks:
  redis-net:
    driver: bridge

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data: